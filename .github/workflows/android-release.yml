name: Android APK Build & GitHub Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Signed APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: 3. Configure Built-in Android SDK & Accept Licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_ROOT}" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "${SDK_ROOT}/cmdline-tools" -name sdkmanager | sort -V | tail -n 1)
          echo "Using sdkmanager: ${SDKMANAGER}"
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" --licenses > /dev/null || true
          yes | "${SDKMANAGER}" --sdk_root="${SDK_ROOT}" "platform-tools" "build-tools;36.0.0" "platforms;android-36" "platforms;android-36.1" || true

      - name: 4. Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: 5. Prepare Environment & Signing Keystores (Zero-Config)
        run: |
          # Ensure .env exists for secrets-gradle-plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Restore debug.keystore from debug.keystore.base64 (or generate fallback)
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Generate release keystore matching app/build.gradle.kts signingConfigs("release")
          STORE_PASS="nexusgraph_release_2026"
          KEY_PASS="nexusgraph_release_2026"
          KEYSTORE_FILE="${GITHUB_WORKSPACE}/my-upload-key.jks"

          if [ ! -f "${KEYSTORE_FILE}" ]; then
            keytool -genkeypair -v \
              -keystore "${KEYSTORE_FILE}" \
              -storetype PKCS12 \
              -storepass "${STORE_PASS}" \
              -alias upload \
              -keypass "${KEY_PASS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=NexusGraph,OU=Mobile,O=NexusGraph,L=Local,S=Local,C=CN"
          fi

          echo "KEYSTORE_PATH=${KEYSTORE_FILE}" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${STORE_PASS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASS}" >> "$GITHUB_ENV"

      - name: 6. Build Debug & Signed Release APKs
        run: |
          gradle assembleDebug assembleRelease --no-daemon --stacktrace
          mkdir -p dist
          RELEASE_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "${RELEASE_APK}" dist/NexusGraph-release-signed.apk
          cp "${DEBUG_APK}" dist/NexusGraph-debug.apk
          ls -lh dist/

      - name: 7. Upload APKs to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NexusGraph-APK-Package
          path: dist/*.apk
          if-no-files-found: error

      - name: 8. Publish APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: "NexusGraph 本地知识图谱工作台 (构建 #${{ github.run_number }})"
          body: |
            ### NexusGraph 知识图谱 Android 安装包
            请在下方 **Assets** 中直接点击下载安装到手机或平板：
            - **`NexusGraph-release-signed.apk`**（推荐：已签名正式版，体积更小、运行更流畅）
            - **`NexusGraph-debug.apk`**（调试版备用包）
          files: |
            dist/NexusGraph-release-signed.apk
            dist/NexusGraph-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
